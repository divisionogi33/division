services:
  division:
    build: .
    container_name: division
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    environment:
      APP_ENV: dev
      DATABASE_URL: "mysql://23Pi3jFtnbWpfiu.root:tszw0eRWXLniBvOM@gateway01.eu-central-1.prod.aws.tidbcloud.com:4000/division?serverVersion=8.0&charset=utf8mb4"
    depends_on:
      - division_db

  division_db:
    image: mysql:8.0
    container_name: division_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: division
      MYSQL_USER: division_user
      MYSQL_PASSWORD: division_pass
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - division_mysql_data:/var/lib/mysql

  division_pma:
    image: phpmyadmin/phpmyadmin
    container_name: division_pma
    ports:
      - "8081:80"
    environment:
      PMA_HOST: division_db
    depends_on:
      - division_db

###> doctrine/doctrine-bundle ###
  database:
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      # You should definitely change the password in production
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-!ChangeMe!}
      POSTGRES_USER: ${POSTGRES_USER:-app}
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-app}", "-U", "${POSTGRES_USER:-app}"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - database_data:/var/lib/postgresql/data:rw
      # You may use a bind-mounted host directory instead, so that it is harder to accidentally remove the volume and lose all your data!
      # - ./docker/db/data:/var/lib/postgresql/data:rw
###< doctrine/doctrine-bundle ###

volumes:
  division_mysql_data:

###> doctrine/doctrine-bundle ###
  database_data:
###< doctrine/doctrine-bundle ###
